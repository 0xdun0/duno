<!-- Floating Tux Companion Guide Widget for Kids -->
<div class="tux-floating-companion" id="tux-companion-widget" aria-label="Tux Guia Interativo">
  <div class="tux-companion-bubble" id="tux-companion-bubble">
    <button type="button" class="tux-companion-close" id="tux-companion-close" aria-label="Fechar dica">×</button>
    <div class="tux-companion-speaker">{{ _('TUX GUIA:') }}</div>
    <div class="tux-companion-msg" id="tux-companion-msg">
      {{ _('Estou aqui com você! Qualquer dúvida, clique em mim para uma dica.') }}
    </div>
  </div>

  <button type="button" class="tux-companion-avatar-btn" id="tux-companion-btn" title="{{ _('Conversar com o Guia / Nova Dica') }}">
    <div class="tux-companion-icon-box">
      <i class="nf nf-fa-shield tux-companion-icon" id="tux-companion-sprite" aria-hidden="true"></i>
    </div>
    <span class="tux-companion-pulse" aria-hidden="true"></span>
  </button>
</div>
