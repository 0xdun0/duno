timeline:
- date: 26 Set
  tag: i18n & Localization
  tag_class: pill-blue
  title: Suporte Multi-Idioma Nativo (PT, EN, ES) e Padronização do Catálogo CTF
  slug: changelog
  summary: Internacionalização completa via Flask-Babel, tradução de todos os templates, hubs desacoplados em YAML, suporte i18n total no DUNO Kids e padronização fonética de máquinas ofensivas.
- date: 19 Set
  tag: Machine Submissions
  tag_class: pill-orange
  title: Pipeline de Submissão e Auditoria de Máquinas da Comunidade
  slug: machine-submission-guide
  summary: Esteira completa com upload de pacotes .zip/.tar.gz, validação estrita
    de manifest.yml, scanner de vulnerabilidades em Dockerfile e Command Center integrado.
- date: 19 Set
  tag: Security Hardening
  tag_class: pill-red
  title: Blindagem Anti-ZipSlip, ZipBomb e Proibição de Symlinks
  slug: security-policy
  summary: Inspeção de magic bytes, contenção via pathlib.Path.relative_to, streaming
    com limite rígido de 100MB e bloqueio total de nós de dispositivo.
- date: 18 Set
  tag: DUNO Kids
  tag_class: pill-purple
  title: Ambiente Lúdico DUNO Kids & Terminal Linux CRT
  slug: kids-curriculum
  summary: 5 Trilhas de aprendizado interativo com o mascote Tux, terminal retrô com
    comandos Linux reais emulados, analogias visuais e desafios checkpoints.
- date: 17 Set
  tag: Challenges Engine
  tag_class: pill-blue
  title: Catálogo de 25 Máquinas Vulneráveis & Orquestrador Dinâmico
  slug: challenges-engine
  summary: Execução isolada de containers CTF na rede duno-challenges-net, temporizador
    regressivo de 45 minutos e submissão validada de flags.
- date: 17 Set
  tag: Network Topology
  tag_class: pill-green
  title: Arquitetura de Segregação Tripartite Red Team
  slug: network-architecture
  summary: Separação completa entre a máquina host do operador, a aplicação de gerenciamento
    duno-app e a subnet de execução de alvos.
- date: 15 Set
  tag: OWASP Core
  tag_class: pill-orange
  title: 20 Módulos de Vulnerabilidades com 4 Níveis Graduais
  slug: owasp-modules
  summary: Treinamento em SQLi, Blind SQLi, XSS, CSRF, File Upload e API Security
    com alternância em tempo real entre Low e Impossible.
