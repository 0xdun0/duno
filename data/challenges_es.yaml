- id: yankee-log4shell
  source: eversec
  source_path: challenges/zero
  category: Explotación de CVE
  os: linux
  name: Cero
  short_description: Explora la vulnerabilidad crítica Log4Shell (CVE-2021-44228)
    en el panel SOC Java para obtener shell y root.
  long_description: Panel de control de monitoreo SOC corporativo implementado en
    Java utilizando la biblioteca Apache Log4j 2.14.1 vulnerable a la ejecución remota
    de código a través de búsquedas JNDI/LDAP. Los atacantes disparan callbacks remotos
