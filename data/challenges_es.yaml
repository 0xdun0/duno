- id: alpha-sqli-basics
  source: eversec
  source_path: challenges/alpha
  category: Inyección SQL
  os: linux
  name: Alfa
  short_description: Explora vulnerabilidades clásicas de SQL Injection para eludir
    la autenticación, extraer datos y obtener ejecución remota de código.
  long_description: Portal corporativo de colaboradores vulnerable a inyección SQL
    en el formulario de autenticación y en el endpoint de consulta de usuarios. Los
    jugadores explotan inyección basada en unión (UNION-based), eludir autenticación
    (auth bypass) y escalan a ejecución remota de código (RCE) y privilegios de root.
  objective: Contornar a autenticação via SQL Injection, extrair hashes e credenciais
    do banco de dados SQLite/MySQL e explorar vetor de escalação de privilégios para
    capturar a flag final de root.
  instructions: '1. Inicie a instância e acesse a página de login da aplicação.

    2. Injete payloads clássicos de bypass de autenticação no campo de usuário (''
    OR 1=1 --).

    3. Extraia o schema das tabelas e credenciais administrativas utilizando UNION
    SELECT.

    4. Obtenha a flag de usuário e escale privilégios no sistema.'
  hints:
  - Teste aspas simples e operadores lógicos básicos para identificar se o input é
    concatenado na query.
  - Utilize a diretiva UNION SELECT NULL, NULL... para descobrir o número exato de
    colunas retornadas.
  - Consulte sqlite_master ou information_schema para descobrir os nomes das tabelas
    e colunas.
  difficulty: easy
  points: 1000
  estimated_minutes: 35
  solves_count: 0
  environment_type: single
  internal_port: 5000
  protocol: http
  status: available
  requires_api_key: false
  has_walkthrough: true
  metadata_version: 1
  card_description: Analice el entorno, identifique las vulnerabilidades presentes
    y obtenga acceso a la bandera final.
- id: bravo
  source: eversec
  source_path: challenges/bravo
  category: Autenticación & JWT
  os: linux
  name: Bravo
  short_description: Explore vulnerabilidades en la firma y validación de tokens JWT
    (algoritmo 'none', clave débil y alteración de claims).
  long_description: 'Portal corporativo utilizando tokens JSON Web Token (JWT) para
    gestión de sesión con fallas críticas de implementación: secreto simétrico previsible/débil,
    aceptación del algoritmo ''none'' y falta de verificación de integridad en el
    backend, permitiendo falsificación de identidad y privilegios administrativos.'
  objective: Analisar a estrutura do token JWT fornecido na autenticação, forjar um
    token com privilégios de administrador ou quebrar a chave secreta via força bruta
    e acessar o painel restrito.
  instructions: '1. Inicie o laboratório e registre uma conta comum no portal.

    2. Inspecione o token JWT recebido no cookie de sessão ou no cabeçalho Authorization.

    3. Utilize jwt_tool ou Hashcat/John the Ripper para recuperar o segredo ou forjar
    claims com alg: ''none''.

    4. Acesse o endpoint /admin com o token forjado para recuperar a flag.'
  hints:
  - Decodifique o cabeçalho e payload do token em base64url para inspecionar os campos.
  - Verifique se o backend aceita assinaturas vazias quando alg é configurado para
    'none'.
  - Palavras-chave comuns como 'secret', 'password' ou 'jwtsecret' são frequentes
    em implementações inseguras.
  difficulty: easy
  points: 1150
  estimated_minutes: 35
  solves_count: 0
  environment_type: single
  internal_port: 5002
  protocol: http
  status: available
  requires_api_key: false
  has_walkthrough: true
  metadata_version: 1
  card_description: Explora la superficie de ataque de la aplicación, investiga los
    flujos de autenticación y captura las banderas.
- id: charlie-cookie-tampering
  source: eversec
  source_path: challenges/charlie
  category: Sesión web
  os: linux
  name: Charlie
  short_description: Manipule cookies de sesión codificados y débilmente protegidos
    para obtener acceso no autorizado a cuentas privilegiadas.
  long_description: Aplicación web que gestiona el estado de la sesión del usuario
    guardando atributos como rol, id y privilegios directamente en la cookie del cliente,
    utilizando solo codificación reversible u ofuscación simple sin firma criptográfica
    HMAC.
  objective: Interromper a requisição HTTP, decodificar e modificar os cookies de
    sessão do navegador para forjar o papel de administrador e capturar a flag de
    acesso.
  instructions: '1. Inicie o desafio e efetue login com credenciais de teste fornecidas.

    2. Inspecione os cookies gerados no Developer Tools (F12) ou via proxy (Burp Suite/OWASP
    ZAP).

    3. Identifique o padrão de codificação (Hex, Base64, JSON) e altere a propriedade
    role para ''admin''.

    4. Atualize o cookie na requisição e recarregue a página protegida.'
  hints:
  - Cookies que começam com eyJ ou semelhantes normalmente são Base64/JSON.
  - Verifique se existe algum cookie nomeado como user_role, auth ou session_data.
  - Recarregue a página após injetar o novo valor para validar a elevação.
  difficulty: easy
  points: 500
  estimated_minutes: 25
  solves_count: 0
  environment_type: single
  internal_port: 4000
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Analice la persistencia de sesión, eluda las restricciones de
    acceso y localice los datos confidenciales.
- id: cheerio
  source: eversec
  source_path: challenges/delta
  category: SSRF y Nube
  os: linux
  name: Delta
  short_description: Explora el análisis inseguro y SSRF interno para consultar metadatos
    de nube (IMDS) y servicios restringidos.
  long_description: Servicio web basado en Node.js y la biblioteca Cheerio para raspado
    y análisis de URLs externas. La ausencia de filtros estrictos de validación permite
    solicitudes Server-Side Request Forgery (SSRF) contra interfaces internas de loopback
    (localhost:3030) y emulación del servicio de metadatos AWS IMDSv1.
  objective: Forçar o servidor a requisitar endpoints internos protegidos (169.254.169.254
    e localhost:3030/keys) e extrair credenciais e flags do ambiente.
  instructions: '1. Inicie a instância e analise a funcionalidade de busca/renderização
    de URLs.

    2. Envie URLs apontando para localhost:3000/admin para coletar o primeiro conjunto
    de credenciais.

    3. Teste o IP do serviço de metadados de nuvem (169.254.169.254) para simular
    SSRF em ambiente cloud.

    4. Alterne os métodos de requisição HTTP em localhost:3030 para revelar as chaves
    secretas.'
  hints:
  - Acesse endpoints internos através da interface de scraping da aplicação.
  - O endereço 169.254.169.254 é o clássico link-local de metadados AWS EC2.
  - Experimente mudar verbos HTTP de HEAD para BODY ou GET nas rotas internas.
  difficulty: medium
  points: 350
  estimated_minutes: 40
  solves_count: 0
  environment_type: single
  internal_port: 3000
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Audite los parámetros de la aplicación web, pruebe los vectores
    de entrada y obtenga acceso elevado.
- id: coffee
  source: eversec
  source_path: challenges/echo
  category: Inclusión de Archivos
  os: linux
  name: Eco
  short_description: Explora la vulnerabilidad de Local File Inclusion (LFI) y Path
    Traversal para extraer archivos de bases de datos y banderas.
  long_description: Tienda virtual de café con sistema de visualización de registros
    e historial de pedidos. El parámetro de consulta de archivos acepta rutas codificadas
    en Base64 sin una sanitización adecuada contra path traversal, lo que permite
    la lectura de archivos arbitrarios del sistema operativo y volcado de la base
    de datos SQLite.
  objective: Explorar LFI no endpoint /logs para ler arquivos protegidos do host (/home/appuser/flag.txt)
    e extrair a base de dados de usuários (/app/users.db).
  instructions: '1. Inicie o desafio e efetue login utilizando as credenciais obtidas
    no desafio Delta.

    2. Inspecione o endpoint de visualização de logs e note o parâmetro ''file'' com
    valor em Base64.

    3. Codifique caminhos absolutos como /home/appuser/flag.txt em Base64 e submeta
    na URL.

    4. Extraia o banco /app/users.db e acerte os arquivos de pedidos /orders/*.txt
    para obter as flags.'
  hints:
  - Decodifique os valores do parâmetro 'file' no visualizador de logs para entender
    o formato esperado.
  - Utilize caminhos absolutos ou sequências de ../ para navegar na estrutura do servidor.
  - Baixe o banco de dados users.db e inspecione as tabelas com sqlite3 ou strings.
  difficulty: medium
  points: 350
  estimated_minutes: 40
  solves_count: 0
  environment_type: single
  internal_port: 4000
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Investigue el servicio en ejecución, descubra puntos ciegos en
    la arquitectura y extraiga la bandera final.
- id: delta-idor-document-vault
  source: eversec
  source_path: challenges/foxtrot
  category: Control de Acceso
  os: linux
  name: Foxtrot
  short_description: Explora fallos de autorización (IDOR) en un depósito corporativo
    de documentos con identificadores previsibles.
  long_description: Sistema corporativo de gestión de documentos demostrando fallas
    clásicas de Insecure Direct Object Reference (IDOR). Los usuarios manipulan IDs
    en URLs y APIs para recuperar archivos confidenciales de terceros, enumerar documentos,
    acceder a elementos eliminados y datos de perfiles.
  objective: Manipular identificadores sequenciais e parâmetros de autorização para
    contornar restrições de acesso horizontal e vertical, obtendo documentos sigilosos
    de outros usuários no cofre.
  instructions: '1. Inicie o laboratório e acesse a aplicação web de gerenciamento
    documental.

    2. Crie ou utilize uma conta padrão para observar o formato e a estrutura das
    URLs de visualização e download de arquivos (/documents/<id>).

    3. Realize enumeração de identificadores alterando o parâmetro de ID sequencial
    e verifique se há controle de permissão por usuário.

    4. Acesse documentos restritos de administradores até localizar a credencial ou
    flag contida no cofre.'
  hints:
  - Documentos excluídos podem continuar acessíveis se o endpoint não validar o status
    do arquivo.
  - Teste cabeçalhos de autorização e IDs numéricos menores ou maiores que o seu documento
    atribuído.
  - Filtros de busca e exportação em lote frequentemente negligenciam verificações
    de permissão.
  difficulty: medium
  points: 700
  estimated_minutes: 40
  solves_count: 0
  environment_type: single
  internal_port: 4001
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Mapee los endpoints del sistema de archivos, eluda el control
    de permisos y recoja los artefactos.
- id: echo-rate-limit-bypass
  source: eversec
  source_path: challenges/ghost
  category: Ruptura de Fuerza Bruta
  os: linux
  name: Fantasma
  short_description: Delimite los límites de solicitud (Rate Limiting) y los encabezados
    de proxy para fuerza bruta de autenticación y PIN.
  long_description: Sistema de inicio de sesión corporativo protegido por un mecanismo
    de limitación de tasa que depende exclusivamente de cabeceras de cliente como
    X-Forwarded-For, Client-IP y X-Real-IP. Los jugadores manipulan estas cabeceras
    para eludir bloqueos y ejecutar ataques de fuerza bruta exitosos contra PINs y
    contraseñas.
  objective: Burlar o bloqueio de taxa de requisições falsificando cabeçalhos de encaminhamento
    de IP e quebrar o PIN de 4 dígitos para obter acesso ao portal e elevar privilégios.
  instructions: '1. Inicie a instância e tente submeter múltiplas tentativas de autenticação
    inválidas até receber o bloqueio 429 Too Many Requests.

    2. Injete cabeçalhos HTTP como X-Forwarded-For com endereços IPs aleatórios a
    cada tentativa.

    3. Automatize o envio de requisições para cobrir o espaço amostral de PINs numéricos
    (0000-9999).

    4. Acesse o sistema autenticado e colete as flags da aplicação.'
  hints:
  - Muitas proteções de rate limit confiam cegamente em cabeçalhos HTTP injetados
    pelo cliente.
  - 'Cabeçalhos a testar: X-Forwarded-For, X-Real-IP, X-Originating-IP, True-Client-IP.'
  - Construa um loop em Python com rotação de IP no cabeçalho para testar as combinações
    rapidamente.
  difficulty: medium
  points: 800
  estimated_minutes: 40
  solves_count: 0
  environment_type: single
  internal_port: 4003
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Evalúe la resiliencia de las rutas frente a solicitudes anómalas,
    explore fallas lógicas y capture la bandera.
- id: foxtrot-xss-support-tickets
  source: eversec
  source_path: challenges/hunter
  category: Cross-Site Scripting
  os: linux
  name: Cazador
  short_description: Explora Cross-Site Scripting (XSS) reflejado y almacenado en
    tickets de soporte para exfiltrar cookies y tokens de administradores.
  long_description: Sistema de soporte a clientes corporativos vulnerable a XSS en
    campos de búsqueda y en el cuerpo de tickets de atención. Un bot de administración
    simula un usuario accediendo a los tickets periódicamente sin cookies protegidas
    por HTTPOnly, permitiendo exfiltración a través de webhook.
  objective: Injetar payload de Stored XSS que roube a sessão administrativa ao ser
    visualizado pelo bot de suporte e capturar as flags protegidas no painel.
  instructions: '1. Inicie a instância e explore o formulário de abertura de tickets
    de suporte.

    2. Teste a sanitização de tags HTML e scripts nos campos de título, mensagem e
    anexos.

    3. Configure um payload de JavaScript que envie document.cookie para o endpoint
    de webhook /webhook/log.

    4. Submeta o ticket e consulte os logs do webhook para capturar o cookie administrativo.'
  hints:
  - O robô administrativo inspeciona novos tickets em intervalos de aproximadamente
    5 segundos.
  - Verifique os logs de exfiltração em /webhook/log periodicamente antes de expirar.
  - Teste tags com manipuladores de eventos como <img src=x onerror=...> para contornar
    filtros básicos.
  difficulty: medium
  points: 1450
  estimated_minutes: 45
  solves_count: 0
  environment_type: single
  internal_port: 4002
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Examine los puntos de interacción de la aplicación, rastree el
    comportamiento de los usuarios y eleve privilegios.
- id: golf-static-analysis-config
  source: eversec
  source_path: challenges/inferno
  category: Reconocimiento
  os: linux
  name: Infierno
  short_description: Explore artefactos de desarrollo expuestos en producción, como
    mapas de origen, historial .git y variables de entorno.
  long_description: Portal de desarrollo publicado en producción que contiene diversos
    artefactos sensibles expuestos. Utilice técnicas de reconocimiento web y análisis
    estático para descubrir mapas de código fuente, repositorio Git (.git), claves
    de API y archivos de configuración (.env y copias de seguridad).
  objective: Realizar reconhecimento em endpoints de produção desprotegidos e analisar
    artefatos públicos para extrair credenciais vazadas, variáveis de ambiente e commits
    históricos do repositório.
  instructions: '1. Inicie a instância e inspecione o código-fonte HTML e arquivos
    JavaScript incluídos.

    2. Verifique declarações de sourceMappingURL nos scripts para reconstruir o código
    original do frontend.

    3. Teste o acesso a pastas sensíveis padrão de deploy (.git, .env, backups, api-keys).

    4. Analise os arquivos revelados para extrair a flag oficial do laboratório.'
  hints:
  - Verifique o arquivo package.json ou comentários nos bundles de scripts.
  - Ferramentas como curl e git-dumper facilitam a inspeção de arquivos .git expostos.
  - Arquivos .env costumam armazenar segredos e chaves de acesso a serviços internos.
  difficulty: medium
  points: 550
  estimated_minutes: 45
  solves_count: 0
  environment_type: single
  internal_port: 4004
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Audite los artefactos disponibles, localice claves y configuraciones
    expuestas y comprometa el servidor.
- id: hotel-junior-dev-challenge
  source: eversec
  source_path: challenges/joker
  category: Scripting
  os: linux
  name: Joker
  short_description: Identifique y rote claves de API comprometidas antes del tiempo
    de espera mediante script automatizado.
  long_description: Un desafío de DevSecOps y automatización donde aproximadamente
    el 30% de las claves de API de la organización se filtraron. El sistema exige
    una rotación con prefijo específico y suma de verificación en una ventana de tiempo
    corta (1,5 s), obligando al desarrollo de un script en lugar de procesamiento
    manual.
  objective: Identificar todas as chaves comprometidas (prefixadas por COMP_), gerar
    chaves válidas de substituição no padrão exigido e submeter as configurações corrigidas
    dentro da janela de 1.5 segundo.
  instructions: '1. Inicie o laboratório e acerte a rota GET /configs para listar
    as 100 configurações de serviços.

    2. Identifique quais credenciais contêm chaves de API iniciando com o prefixo
    COMP_.

    3. Construa um script em Python para gerar chaves substitutas no formato PROD_RANDOM32CHARS_CHECKSUM,
    onde o CHECKSUM são os 4 primeiros caracteres hexadecimais do MD5 da parte aleatória.

    4. Submeta o payload corrigido via POST /validate antes do limite de tempo para
    capturar a flag.'
  hints:
  - Chaves em ambiente de produção devem obrigatoriamente usar o prefixo PROD_.
  - O checksum MD5 deve ser calculado exclusivamente sobre a sequência aleatória de
    32 caracteres maiúsculos.
  - Use requisições persistentes (requests.Session) para reduzir a latência de rede
    no envio do POST.
  difficulty: medium
  points: 200
  estimated_minutes: 30
  solves_count: 0
  environment_type: single
  internal_port: 3000
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Inspeccione los recursos de la aplicación, pruebe los mecanismos
    de control y ejecute la invasión del objetivo.
- id: india-nosql-injection
  source: eversec
  source_path: challenges/knight
  category: Inyección NoSQL
  os: linux
  name: Caballero
  short_description: Explora operadores de consulta NoSQL (MongoDB/NeDB) para saltarse
    la autenticación y extraer datos sensibles.
  long_description: Portal web moderno que consume entradas del usuario en formato
    JSON y las pasa directamente a consultas MongoDB/NeDB sin validación de tipos
    de datos. Permite la inyección de operadores como $ne, $regex, $gt para evadir
    contraseñas y extraer caracteres de secretos.
  objective: Injetar objetos JSON com operadores NoSQL para realizar autenticação
    arbitrária e executar extração de flags caractere por caractere via regex.
  instructions: '1. Inicie a instância e inspecione a rota de login /api/login.

    2. Substitua o payload de texto por JSON estruturado com operadores como {"password":
    {"$ne": null}}.

    3. Utilize o operador $regex no formulário para enumerar tokens e senhas de administradores.

    4. Reconstrua o token e capture a flag no painel interno.'
  hints:
  - Altere o Content-Type para application/json para enviar objetos NoSQL.
  - 'O operador {"$regex": "^a.*"} permite testar o primeiro caractere de uma senha.'
  - Crie um script em Python para automatizar a busca binária ou linear caractere
    a caractere.
  difficulty: medium
  points: 1800
  estimated_minutes: 45
  solves_count: 0
  environment_type: single
  internal_port: 4007
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Identifique anomalías en el procesamiento de consultas, explore
    fallas de validación y acceda a la base de datos.
- id: juliet-xxe-injection
  source: eversec
  source_path: challenges/lynx
  category: Inyección XML
  os: linux
  name: Lince
  short_description: Explorar el analizador XML inseguro a través de entidades externas
    (XXE), lectura arbitraria de archivos y SSRF.
  long_description: Sistema de facturación automática que realiza parsing de archivos
    XML con recursos DTD y entidades externas habilitados. Demuestra cómo configuraciones
    inseguras de parsers XML permiten la lectura de archivos en el host, SSRF interno
    y potencial encadenamiento para RCE.
  objective: Injetar entidades XML externas maliciosas (DOCTYPE/ENTITY) no payload
    da nota fiscal para realizar leitura arbitrária de arquivos no sistema do container
    e recuperar a flag protegida.
  instructions: '1. Inicie o laboratório e capture o endpoint de submissão de faturas/invoices
    que consome XML.

    2. Analise a estrutura do documento XML esperado pela aplicação de faturamento.

    3. Construa uma declaração DOCTYPE com ENTITY referenciando recursos do sistema
    de arquivos via protocolo file:///.

    4. Envie o payload e extraia a resposta processada para ler o arquivo contendo
    a flag.'
  hints:
  - Verifique se o parser retorna o conteúdo de nós XML no corpo da resposta.
  - Entidades externas do tipo <!ENTITY xxe SYSTEM 'file:///flag.txt'> são a base
    clássica do ataque.
  - Se a resposta direta for sanitizada, teste canais fora-de-banda (OOB) via HTTP.
  difficulty: hard
  points: 250
  estimated_minutes: 45
  solves_count: 0
  environment_type: single
  internal_port: 4005
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Mapee la ingestión de datos de la API, fuerce la filtración de
    archivos internos y domine el sistema.
- id: kilo-ssti-template-generator
  source: eversec
  source_path: challenges/mantis
  category: Inyección de plantillas
  os: linux
  name: Mantis
  short_description: Explora la Inyección de Plantillas del Lado del Servidor (SSTI)
    en Jinja2/Nunjucks para romper la sandbox y ejecutar comandos en el sistema.
  long_description: Generador corporativo de modelos de correo electrónico que renderiza
    plantillas combinando texto del usuario con motores de plantilla (Jinja2/Nunjucks).
    Fallos en la sanitización permiten inyección de expresiones {{ ... }} que alcanzan
    clases internas de Python/Node.js y culminan en RCE.
  objective: Identificar a engine de templates ativa, injetar payloads para enumerar
    a hierarquia de objetos (MRO) e invocar subprocessos do sistema operacional para
    ler a flag.
  instructions: '1. Inicie o desafio e acesse o editor de templates de e-mail.

    2. Teste expressões matemáticas como {{7*7}} e {{config}} para detectar SSTI.

    3. Navegue pela cadeia de herança com ().__class__.__bases__[0].__subclasses__()
    para localizar subprocess.Popen ou os.system.

    4. Execute comandos para ler o arquivo de flag no filesystem.'
  hints:
  - Se {{7*7}} retornar 49, a aplicação está avaliando código dentro da template engine.
  - Preste atenção em caracteres bloqueados como ponto, aspas ou colchetes, utilizando
    filtros alternativos.
  - Em Node.js, explore templates Nunjucks ou Pug procurando por referências globais
    ou require.
  difficulty: hard
  points: 1300
  estimated_minutes: 50
  solves_count: 0
  environment_type: single
  internal_port: 4006
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Investigue el mecanismo de renderización del backend, explore
    la inyección de comandos y obtenga acceso root.
- id: lima-deserialization-session
  source: eversec
  source_path: challenges/nexus
  category: Desserialización
  os: linux
  name: Nexus
  short_description: Explora la deserialización insegura de objetos (Python pickle
    / Node serialize) para ejecución arbitraria de código.
  long_description: Aplicación de gestión de sesiones con funciones avanzadas que
    almacena estados complejos serializados en el cliente. El backend deserializa
    los datos sin verificación de firma, permitiendo la construcción de cargas útiles
    de inyección de clases maliciosas.
  objective: Construir um gadget malicioso serializado (pickle/serialize) que execute
    comandos remotos no momento em que o servidor deserializar a sessão.
  instructions: '1. Inicie o laboratório e analise como a sessão do usuário é transportada
    (Base64 nos cookies ou headers).

    2. Identifique a tecnologia de serialização subjacente (ex: Python pickle, Java,
    Node.js serialize).

    3. Elabore um script que gere o payload malicioso implementando o método mágico
