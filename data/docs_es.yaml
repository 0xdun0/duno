timeline:
- date: 26 Set
  tag: i18n & Localización
  tag_class: pill-blue
  title: Soporte Multilingüe Nativo (PT, EN, ES) y Estandarización de Desafíos CTF
  slug: changelog
  summary: Internacionalización completa vía Flask-Babel, 100% de plantillas traducidas, hubs desacoplados en YAML, soporte i18n total en DUNO Kids y alineación fonética de máquinas ofensivas.
- date: 19 Set
  tag: Machine Submissions
  tag_class: pill-orange
  title: Pipeline de Envío y Auditoría de Máquinas de la Comunidad
  slug: machine-submission-guide
  summary: Cadena completa con carga de paquetes .zip/.tar.gz, validación estricta
    de manifest.yml, escáner de vulnerabilidades en Dockerfile y Command Center integrado.
- date: 19 Set
  tag: Security Hardening
  tag_class: pill-red
  title: Blindaje Anti-ZipSlip, ZipBomb y Prohibición de Symlinks
  slug: security-policy
  summary: Inspección de magic bytes, contención vía pathlib.Path.relative_to, transmisión
    con límite estricto de 100MB y bloqueo total de nodos de dispositivo.
- date: 18 Set
  tag: DUNO Kids
  tag_class: pill-purple
  title: Entorno Lúdico DUNO Kids & Terminal Linux CRT
  slug: kids-curriculum
  summary: 5 Rutas de aprendizaje interactivo con la mascota Tux, terminal retro con
    comandos Linux reales emulados, analogías visuales y desafíos checkpoints.
- date: 17 Set
  tag: Challenges Engine
  tag_class: pill-blue
  title: Catálogo de 25 Máquinas Vulnerables & Orquestador Dinámico
  slug: challenges-engine
  summary: Ejecución aislada de contenedores CTF en la red duno-challenges-net, temporizador
    regresivo de 45 minutos y envío validado de flags.
- date: 17 Set
  tag: Network Topology
  tag_class: pill-green
  title: Arquitectura de Segregación Tripartita Red Team
  slug: network-architecture
  summary: Separación completa entre la máquina anfitriona del operador, la aplicación
    de gestión duno-app y la subred de ejecución de objetivos.
- date: 15 Set
  tag: OWASP Core
  tag_class: pill-orange
  title: 20 Módulos de Vulnerabilidades con 4 Niveles Graduados
  slug: owasp-modules
  summary: Entrenamiento en SQLi, Blind SQLi, XSS, CSRF, Carga de Archivos y Seguridad
    de API con alternancia en tiempo real entre Low e Impossible.
