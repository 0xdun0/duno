- id: oscar-race-conditions
  source: eversec
  source_path: challenges/oscar-race-conditions
  category: Condição de Corrida
  os: linux
  name: Raven
  short_description: Explore condições de corrida (Race Conditions) em validação de
    cupons e transferências financeiras concorrentes.
  long_description: Plataforma de checkout e cupons promocionais onde a verificação
    de saldo e resgate não utiliza locks de transação ou isolamento adequado. Ao enviar
    requisições concorrentes em milissegundos, múltiplos resgates do mesmo cupom são
    aprovados.
  objective: Construir um exploit multithreaded ou em pipeline HTTP/2 para explorar
    a janela de tempo entre a checagem e o débito (TOCTOU), acumulando créditos suficientes
    para adquirir a flag.
  instructions: '1. Inicie a instância e analise o fluxo de aplicação de cupom promocional
    no painel do usuário.

    2. Observe que cada cupom só pode ser utilizado teoricamente uma única vez.

    3. Desenvolva um script assíncrono em Python (com asyncio/threading) para enviar
    20+ requisições simultâneas de resgate.

    4. Verifique o saldo inflacionado e adquira o item de flag na loja.'
  hints:
  - Utilize requests em threads sincronizadas com threading.Barrier ou HTTP/2 multiplexing.
  - A janela de oportunidade entre a leitura do banco e a atualização é de poucos
    milissegundos.
  - Turbo Intruder no Burp Suite é uma ferramenta ideal para ataques de race condition.
  difficulty: hard
  points: 1650
  estimated_minutes: 45
  solves_count: 0
  environment_type: single
  internal_port: 4011
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
- id: papa-graphql-injection
  source: eversec
  source_path: challenges/papa-graphql-injection
  category: GraphQL Injection
  os: linux
  name: Shadow
  short_description: Explore introspecção GraphQL, bypassing de autorização em resolvers
    e injeções em consultas complexas.
  long_description: API corporativa moderna desenvolvida com GraphQL com introspecção
    habilitada e ausência de controles de autorização em determinados resolvers. Permite
    descobrir tipos ocultos, schemas de dados confidenciais e realizar injeções nos
    argumentos das queries.
  objective: Extrair o schema completo via consulta de introspecção (__schema), localizar
    mutations/queries administrativas desprotegidas e obter acesso a dados restritos.
  instructions: '1. Inicie o laboratório e localize o endpoint GraphQL (/graphql).

    2. Envie uma query de introspecção para mapear todos os tipos, queries e mutations
    disponíveis.

    3. Identifique consultas sensíveis relacionadas a credenciais ou usuários administrativos.

    4. Formule a consulta GraphQL correspondente e extraia as flags do sistema.'
  hints:
  - Queries com { __schema { types { name } } } revelam a estrutura completa da API.
  - Ferramentas como GraphQL Voyager ou InQL facilitam a visualização dos tipos disponíveis.
  - Verifique se resolvers aceitam injeção de parâmetros sem sanitização SQL ou NoSQL.
