- id: tango-calculator
  source: eversec
  source_path: challenges/tango-calculator
  category: Segurança de IA & LLM
  os: linux
  name: Viper
  short_description: Explore Prompt Injection em calculadora baseada em LLM para vazar
    instruções de sistema e segredos.
  long_description: Aplicação web moderna de calculadora e processamento de linguagem
    natural impulsionada por modelos de inteligência artificial. Falhas de sanitização
    de prompt permitem ataques de jailbreak e injeção de instruções que forçam o modelo
    a ignorar regras de segurança e vazar a chave secreta.
  objective: Engenhar entradas de texto que contornem a validação de formato matemático,
    induzindo o modelo de IA a revelar o segredo embutido no seu system prompt.
  instructions: '1. Inicie o laboratório e acesse a interface interativa da calculadora
    de IA.

    2. Teste operações matemáticas convencionais e observe o formato das respostas
    fornecidas.

    3. Formule técnicas de Prompt Injection (ex: ignore instruções anteriores, modo
    de depuração, tradução reversa).

    4. Extraia o texto do prompt de sistema e capture a flag protegida.'
  hints:
  - Tente pedir para o modelo expressar o conteúdo de suas regras iniciais como uma
    equação matemática.
  - Técnicas de roleplay ou fingir ser o desenvolvedor do sistema frequentemente contornam
    restrições superficiais.
  - Utilize caracteres de escape ou codificações para burlar eventuais filtros de
    palavras restritas no frontend.
