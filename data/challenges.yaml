- id: quebec-enumeration
  source: eversec
  source_path: challenges/quebec-enumeration
  category: Enumeração Web
  os: linux
  name: Specter
  short_description: Descubra 15 flags ocultas através de enumeração exaustiva de
    diretórios, arquivos de backup e metadados expostos.
  long_description: 'Site institucional corporativo contendo dezenas de artefatos
    esquecidos por equipes de desenvolvimento ágil: arquivos robots.txt, sitemaps,
    pastas de backup (.zip, .bak), histórico .git, arquivos .env e endpoints administrativos
    desprotegidos.'
  objective: Realizar enumeração estruturada com wordlists especializadas para encontrar
    diretórios ocultos, arquivos sensíveis de configuração e coletar as 15 flags distribuídas.
  instructions: '1. Inicie a instância e examine os arquivos de índice, robots.txt
    e sitemap.xml.

    2. Execute ferramentas de brute-force de diretórios (gobuster, ffuf, feroxbuster)
    com wordlists de reconhecimento web.

    3. Inspecione cabeçalhos de resposta HTTP, comentários HTML e endpoints de debug.

    4. Conecte os fragmentos de informação para coletar as flags disponíveis.'
  hints:
  - Verifique extensões comuns como .env, .bak, .old, .zip e .git.
  - Arquivos de documentação de API (/docs, /swagger, /openapi.json) frequentemente
    expõem rotas internas.
  - Atenção aos códigos de status HTTP 301, 302 e 403 que podem indicar diretórios
