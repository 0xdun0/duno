  long_description: Arquivo digital corporativo contendo 5 documentos sigilosos protegidos
    por diferentes técnicas criptográficas e esquemas de codificação progressivos
    (Base64, Hexadecimal com inversão, substituição binária, ROT13/JWT e ROT8000).
  objective: Analisar as características de cada arquivo criptografado, construir
    a receita de decodificação correta no CyberChef ou scripts em Python e revelar
    todas as flags.
