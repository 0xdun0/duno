- id: zulu-koa-devtools
  source: eversec
  source_path: challenges/zulu-koa-devtools
  category: DevTools & Node Exploitation
  os: linux
  name: Zenith
  short_description: Explore vazamento de código fonte em Koa.js, bypass de controle
    de acesso de host e execução de scripts.
  long_description: Portal interno de ferramentas de desenvolvedores em Koa.js que
    expõe sua pasta de trabalho como arquivos estáticos (incluindo repositório .git).
    A análise do código fonte revela um endpoint de execução de scripts restrito a
    localhost que pode ser contornado via manipulação do cabeçalho Host.
  objective: Extrair o código fonte pelo vazamento de arquivos estáticos, contornar
    a validação de localhost no cabeçalho Host e invocar comandos com privilégios
    de root.
  instructions: '1. Inicie a instância e analise os arquivos estáticos expostos no
    servidor web.

    2. Recupere o histórico de commits do repositório .git oculto para encontrar tokens
    vazados.

    3. Inspecione o código de /admin/execute e explore o bypass do cabeçalho Host
    (Host: localhost:fake@ip:4022).

    4. Submeta scripts para execução remota e leia a flag final.'
  hints:
  - Use git-dumper ou curl para reconstruir o repositório a partir de /.git/logs/HEAD.
  - Analise como a biblioteca de roteamento valida se o requisitante é localhost.
  - Verifique o manipulador de execução de scripts para escapar do contexto e executar
    comandos no SO.
  difficulty: hard
  points: 1600
  estimated_minutes: 55
  solves_count: 0
  environment_type: single
  internal_port: 4022
  protocol: http
  status: available
  requires_api_key: false
