  metadata_version: 1
- id: hotel-junior-dev-challenge
  source: eversec
  source_path: challenges/hotel-junior-dev-challenge
  category: Scripting
  os: linux
  name: Joker
  short_description: Identifique e rotacione chaves de API comprometidas antes do
    timeout via script automatizado.
  long_description: Um desafio de DevSecOps e automação onde aproximadamente 30% das
    chaves de API da organização foram vazadas. O sistema exige uma rotação com prefixo
    específico e checksum em uma janela de tempo curta (1.5s), forçando o desenvolvimento
    de um script em vez de processamento manual.
  objective: Identificar todas as chaves comprometidas (prefixadas por COMP_), gerar
    chaves válidas de substituição no padrão exigido e submeter as configurações corrigidas
    dentro da janela de 1.5 segundo.
  instructions: '1. Inicie o laboratório e acerte a rota GET /configs para listar
    as 100 configurações de serviços.

    2. Identifique quais credenciais contêm chaves de API iniciando com o prefixo
    COMP_.

    3. Construa um script em Python para gerar chaves substitutas no formato PROD_RANDOM32CHARS_CHECKSUM,
    onde o CHECKSUM são os 4 primeiros caracteres hexadecimais do MD5 da parte aleatória.

    4. Submeta o payload corrigido via POST /validate antes do limite de tempo para
    capturar a flag.'
  hints:
  - Chaves em ambiente de produção devem obrigatoriamente usar o prefixo PROD_.
  - O checksum MD5 deve ser calculado exclusivamente sobre a sequência aleatória de
    32 caracteres maiúsculos.
  - Use requisições persistentes (requests.Session) para reduzir a latência de rede
    no envio do POST.
  difficulty: medium
  points: 200
  estimated_minutes: 30
  solves_count: 0
  environment_type: single
  internal_port: 3000
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
- id: india-nosql-injection
  source: eversec
  source_path: challenges/india-nosql-injection
  category: NoSQL Injection
  os: linux
  name: Knight
  short_description: Explore operadores de consulta NoSQL (MongoDB/NeDB) para contornar
    autenticação e exfiltrar dados confidenciais.
  long_description: Portal web moderno que consome entradas do usuário em formato
    JSON e repassa diretamente a queries MongoDB/NeDB sem validação de tipos de dados.
    Permite a injeção de operadores como $ne, $regex, $gt para burlar senhas e extrair
    caracteres de segredos.
  objective: Injetar objetos JSON com operadores NoSQL para realizar autenticação
    arbitrária e executar extração de flags caractere por caractere via regex.
  instructions: '1. Inicie a instância e inspecione a rota de login /api/login.

    2. Substitua o payload de texto por JSON estruturado com operadores como {"password":
    {"$ne": null}}.

    3. Utilize o operador $regex no formulário para enumerar tokens e senhas de administradores.

    4. Reconstrua o token e capture a flag no painel interno.'
  hints:
  - Altere o Content-Type para application/json para enviar objetos NoSQL.
  - 'O operador {"$regex": "^a.*"} permite testar o primeiro caractere de uma senha.'
  - Crie um script em Python para automatizar a busca binária ou linear caractere
    a caractere.
  difficulty: medium
  points: 1800
  estimated_minutes: 45
  solves_count: 0
  environment_type: single
  internal_port: 4007
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
- id: juliet-xxe-injection
  source: eversec
  source_path: challenges/juliet-xxe-injection
  category: Injeção XML
  os: linux
  name: Lynx
  short_description: Explore parser XML inseguro através de entidades externas (XXE),
    leitura arbitrária de arquivos e SSRF.
  long_description: Sistema de faturamento automático que realiza parsing de arquivos
    XML com recursos DTD e entidades externas habilitados. Demonstra como configurações
    inseguras de parsers XML possibilitam leitura de arquivos no host, SSRF interno
    e potencial encadeamento para RCE.
  objective: Injetar entidades XML externas maliciosas (DOCTYPE/ENTITY) no payload
    da nota fiscal para realizar leitura arbitrária de arquivos no sistema do container
    e recuperar a flag protegida.
  instructions: '1. Inicie o laboratório e capture o endpoint de submissão de faturas/invoices
    que consome XML.

    2. Analise a estrutura do documento XML esperado pela aplicação de faturamento.

    3. Construa uma declaração DOCTYPE com ENTITY referenciando recursos do sistema
    de arquivos via protocolo file:///.

    4. Envie o payload e extraia a resposta processada para ler o arquivo contendo
    a flag.'
  hints:
  - Verifique se o parser retorna o conteúdo de nós XML no corpo da resposta.
  - Entidades externas do tipo <!ENTITY xxe SYSTEM 'file:///flag.txt'> são a base
    clássica do ataque.
  - Se a resposta direta for sanitizada, teste canais fora-de-banda (OOB) via HTTP.
  difficulty: hard
  points: 250
  estimated_minutes: 45
  solves_count: 0
  environment_type: single
  internal_port: 4005
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
- id: kilo-ssti-template-generator
  source: eversec
  source_path: challenges/kilo-ssti-template-generator
  category: Template Injection
  os: linux
  name: Mantis
  short_description: Explore Server-Side Template Injection (SSTI) em Jinja2/Nunjucks
    para quebrar a sandbox e executar comandos no sistema.
  long_description: Gerador corporativo de modelos de e-mail que renderiza templates
    combinando texto do usuário com engines de template (Jinja2/Nunjucks). Falhas
    na sanitização permitem injeção de expressões {{ ... }} que alcançam classes internas
    de Python/Node.js e culminam em RCE.
  objective: Identificar a engine de templates ativa, injetar payloads para enumerar
    a hierarquia de objetos (MRO) e invocar subprocessos do sistema operacional para
    ler a flag.
  instructions: '1. Inicie o desafio e acesse o editor de templates de e-mail.

    2. Teste expressões matemáticas como {{7*7}} e {{config}} para detectar SSTI.

    3. Navegue pela cadeia de herança com ().__class__.__bases__[0].__subclasses__()
    para localizar subprocess.Popen ou os.system.

    4. Execute comandos para ler o arquivo de flag no filesystem.'
  hints:
  - Se {{7*7}} retornar 49, a aplicação está avaliando código dentro da template engine.
  - Preste atenção em caracteres bloqueados como ponto, aspas ou colchetes, utilizando
    filtros alternativos.
  - Em Node.js, explore templates Nunjucks ou Pug procurando por referências globais
    ou require.
  difficulty: hard
  points: 1300
  estimated_minutes: 50
  solves_count: 0
  environment_type: single
  internal_port: 4006
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
- id: lima-deserialization-session
  source: eversec
  source_path: challenges/lima-deserialization-session
  category: Desserialização
  os: linux
  name: Nexus
  short_description: Explore desserialização insegura de objetos (Python pickle /
    Node serialize) para execução arbitrária de código.
  long_description: Aplicação de gerenciamento de sessões com recursos avançados que
    armazena estados complexos serializados no cliente. O backend desserializa os
    dados sem checagem de assinatura, permitindo a construção de payloads de injeção
    de classes maliciosas.
  objective: Construir um gadget malicioso serializado (pickle/serialize) que execute
    comandos remotos no momento em que o servidor deserializar a sessão.
  instructions: '1. Inicie o laboratório e analise como a sessão do usuário é transportada
    (Base64 nos cookies ou headers).

    2. Identifique a tecnologia de serialização subjacente (ex: Python pickle, Java,
    Node.js serialize).

    3. Elabore um script que gere o payload malicioso implementando o método mágico
    apropriado (ex: __reduce__ em Python).

    4. Envie o payload e obtenha a flag ou shell reverso.'
  hints:
  - O início de blobs pickle costuma conter bytes característicos como \x80\x03 ou
    \x80\x04.
  - Em Python, a função __reduce__ permite especificar uma função de chamada e seus
    argumentos ao desserializar.
  - Utilize ferramentas como ysoserial ou scripts customizados para montar os gadgets.
  difficulty: hard
  points: 900
  estimated_minutes: 50
  solves_count: 0
  environment_type: single
  internal_port: 4008
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
- id: mike-ssrf-to-rce
  source: eversec
  source_path: challenges/mike-ssrf-to-rce
  category: SSRF & RCE
  os: linux
  name: Oracle
  short_description: Encadeie Server-Side Request Forgery (SSRF) com serviços internos
    desprotegidos para atingir Remote Code Execution.
  long_description: Ferramenta de checagem de status de websites corporativos com
    vulnerabilidade de SSRF. O atacante pivota a requisição para serviços internos
    de cache ou mensageria escutando em portas locais (Redis/Docker API) e escala
    para execução remota de código.
  objective: Descobrir portas e serviços internos na rede do container via SSRF e
    forjar comandos de escrita para atingir execução de código.
  instructions: '1. Inicie a instância e explore o formulário de verificação de URLs
    (/check-health).

    2. Realize varredura de portas internas na rede local através de requisições a
    127.0.0.1:<porta>.

    3. Identifique o serviço em execução na porta interna e prepare requisições com
    protocolos suportados (gopher:// ou HTTP).

    4. Invoque o comando de leitura da flag.'
  hints:
  - Tente esquemas como http://127.0.0.1 ou http://localhost para mapear serviços
    internos.
  - Serviços como Redis e Memcached permitem injeção de comandos com o protocolo gopher://.
  - 'Filtros de IP podem ser contornados usando representações decimais ou hexadecimais
    (ex: 2130706433).'
  difficulty: hard
  points: 1500
  estimated_minutes: 55
  solves_count: 0
  environment_type: single
  internal_port: 4010
  protocol: http
  status: available
  requires_api_key: false
