    2. Formate uma requisição POST direcionada ao endpoint de formulário vulnerável
    com parâmetros renderizáveis (#post_render).

    3. Invoque comandos de sistema como ''id'' ou ''cat /flag.txt'' no payload.

    4. Capture as flags de sistema e de aplicação.'
  hints:
  - A vulnerabilidade afeta a camada Form API e render arrays do Drupal 7 e 8.
  - Scripts de PoC amplamente documentados no GitHub utilizam o endpoint de registro
