    de ofuscação.

    3. Utilize ferramentas como CyberChef ou scripts locais para decodificar e decifrar
    cada camada.

    4. Submeta as flags extraídas de cada arquivo.'
  hints:
  - Use o recurso 'Magic' ou 'Entropy' do CyberChef para detectar tipos de cifras
    desconhecidas.
