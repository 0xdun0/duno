  long_description: Cenário de resposta a incidentes (DFIR - Operation Midnight Raven)
    simulando invasão em estações de trabalho corporativas. O analista investiga dumps
    de memória utilizando Volatility e utilitários de análise de strings para identificar
    processos suspeitos, conexões de rede e credenciais exfiltradas.
  objective: Baixar o arquivo de evidência de memória do portal de incidentes, identificar
    o processo malicioso em execução e recuperar chaves e artefatos de persistência
    deixados pelo atacante.
  instructions: '1. Inicie o laboratório e acesse a plataforma de gerenciamento de
    casos de perícia.

    2. Baixe o pacote de dump de memória referente ao incidente ''Patient Zero''.

    3. Execute ferramentas como strings, grep ou plugins de Volatility 3 para analisar
