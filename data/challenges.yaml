  short_description: Explore a clássica vulnerabilidade Drupalgeddon 2 (CVE-2018-7600)
    para injeção de código e comprometimento do servidor.
  long_description: Portal de conteúdo corporativo legado em execução sobre Drupal
    7.57 sem patches de segurança. A vulnerabilidade crítica no formulário de registro
    de usuários permite que atacantes injetem parâmetros renderizáveis manipulados
    e executem comandos arbitrários no servidor.
  objective: Explorar a falha CVE-2018-7600 via requisição POST maliciosa contra a
    API de formulários do Drupal e obter execução de comandos como usuário www-data.
  instructions: '1. Inicie o laboratório e confirme a versão do Drupal em execução
