timeline:
- date: 26 Sep
  tag: i18n & Localization
  tag_class: pill-blue
  title: Native Multi-Language Support (PT, EN, ES) & CTF Catalog Standardization
  slug: changelog
  summary: Complete internationalization via Flask-Babel, 100% template translation, decoupled YAML data hubs, full i18n in DUNO Kids, and phonetic directory alignment for offensive targets.
- date: 19 Set
  tag: Machine Submissions
  tag_class: pill-orange
  title: Community Machine Submission and Audit Pipeline
  slug: machine-submission-guide
  summary: Complete pipeline with upload of .zip/.tar.gz packages, strict validation
    of manifest.yml, vulnerability scanner in Dockerfile, and integrated Command Center.
- date: 19 Set
  tag: Security Hardening
  tag_class: pill-red
  title: Anti-ZipSlip, ZipBomb Shielding and Symlinks Prohibition
  slug: security-policy
  summary: Inspection of magic bytes, containment via pathlib.Path.relative_to, streaming
    with a strict limit of 100MB, and total blocking of device nodes.
- date: 18 Set
  tag: DUNO Kids
  tag_class: pill-purple
  title: Playful Environment DUNO Kids & Linux Terminal CRT
  slug: kids-curriculum
  summary: 5 interactive learning tracks with the mascot Tux, retro terminal with
    real emulated Linux commands, visual analogies, and checkpoint challenges.
- date: 17 Set
  tag: Challenges Engine
  tag_class: pill-blue
  title: Catalog of 25 Vulnerable Machines & Dynamic Orchestrator
  slug: challenges-engine
  summary: Isolated execution of CTF containers on the duno-challenges-net network,
    45-minute countdown timer, and validated flag submission.
- date: 17 Set
  tag: Network Topology
  tag_class: pill-green
  title: Tripartite Red Team Segregation Architecture
  slug: network-architecture
  summary: Complete separation between the operator's host machine, the duno-app management
    application, and the target execution subnet.
- date: 15 Set
  tag: OWASP Core
  tag_class: pill-orange
  title: 20 Vulnerability Modules with 4 Gradual Levels
  slug: owasp-modules
  summary: Training in SQLi, Blind SQLi, XSS, CSRF, File Upload, and API Security
    with real-time switching between Low and Impossible.
