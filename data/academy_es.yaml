  title: Inyección y Bases de Datos
  kicker: VULNERABILIDADES DE INYECCIÓN
  desc: Fallos en la separación entre código y datos en consultas SQL, comandos del
    sistema e inclusión de archivos.
  icon: injection
  modules_count: 5
