  title: Autenticación y sesión
  kicker: LÍMITES DE IDENTIDAD
  desc: Mecanismos de autenticación, generación y validación de sesión, fuerza bruta
    y bypass de CAPTCHA.
  icon: auth
  modules_count: 4
  slugs:
