- id: yankee-log4shell
  source: eversec
  source_path: challenges/zero
  category: CVE Exploitation
  os: linux
  name: Zero
  short_description: Explore the critical Log4Shell vulnerability (CVE-2021-44228)
    in a Java SOC panel to obtain shell and root.
  long_description: Corporate SOC monitoring dashboard implemented in Java using the
    Apache Log4j 2.14.1 library vulnerable to remote code execution through JNDI/LDAP
    lookups. Attackers trigger remote callbacks and escalate privileges in the system
    via sudo.
  objective: Identificar campos de entrada registrados no log do servidor, injetar
    expressões JNDI maliciosas para obter execução remota de código e escalar privilégios
    para root.
  instructions: '1. Inicie o laboratório e explore as rotas de busca de logs e relatórios
    da plataforma SOC.

    2. Identifique quais cabeçalhos HTTP ou parâmetros de formulário são passados
    para o log do Log4j (ex: User-Agent, filtros).

    3. Injete strings com sintaxe de lookup JNDI (${jndi:ldap://...} ou ${jndi:rmi://...}).

    4. Execute comandos para ler a flag e escale para root utilizando comandos autorizados
    no sudoers.'
  hints:
  - Campos como User-Agent, X-Api-Version e inputs de busca costumam ser registrados
    em logs corporativos.
  - Para contornar filtros ingênuos de strings, use técnicas de ofuscação do Log4j
    como ${lower:j}${lower:n}di.
  - Verifique permissões com 'sudo -l' assim que obtiver acesso shell no container.
  difficulty: hard
  points: 1500
  estimated_minutes: 50
  solves_count: 0
  environment_type: single
  internal_port: 4020
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Identify vulnerable registry vectors, exploit remote code execution,
    and obtain the shell.
- id: zulu-koa-devtools
  source: eversec
  source_path: challenges/zenith
  category: DevTools & Node Exploitation
  os: linux
  name: Zenith
  short_description: Explore source code leakage in Koa.js, host access control bypass,
    and script execution.
  long_description: Internal portal of developer tools in Koa.js that exposes its
    workspace as static files (including the .git repository). Analysis of the source
    code reveals a script execution endpoint restricted to localhost that can be bypassed
    via Host header manipulation.
  objective: Extrair o código fonte pelo vazamento de arquivos estáticos, contornar
    a validação de localhost no cabeçalho Host e invocar comandos com privilégios
    de root.
  instructions: '1. Inicie a instância e analise os arquivos estáticos expostos no
    servidor web.

    2. Recupere o histórico de commits do repositório .git oculto para encontrar tokens
    vazados.

    3. Inspecione o código de /admin/execute e explore o bypass do cabeçalho Host
    (Host: localhost:fake@ip:4022).

    4. Submeta scripts para execução remota e leia a flag final.'
  hints:
  - Use git-dumper ou curl para reconstruir o repositório a partir de /.git/logs/HEAD.
  - Analise como a biblioteca de roteamento valida se o requisitante é localhost.
  - Verifique o manipulador de execução de scripts para escapar do contexto e executar
    comandos no SO.
  difficulty: hard
  points: 1600
  estimated_minutes: 55
  solves_count: 0
  environment_type: single
  internal_port: 4022
  protocol: http
  status: available
  requires_api_key: false
  metadata_version: 1
  has_walkthrough: true
  card_description: Analyze development tools active in production, discover debug
    flaws, and capture the final flag.
