{% extends "base.html" %}

{% block title %}Submit Ticket - EverSec{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 700px;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 600;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 5px;
        font-size: 1em;
        font-family: inherit;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: #667eea;
    }

    textarea {
        min-height: 150px;
        resize: vertical;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 30px;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>➕ Submit New Ticket</h1>
    <p style="color: #666; margin-bottom: 30px;">Create a new support ticket for our team to review</p>

    <form action="{{ url_for('submit_ticket') }}" method="POST">
        <div class="form-group">
            <label for="title">Ticket Title *</label>
            <input type="text" id="title" name="title" required placeholder="Brief description of the issue">
        </div>

        <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" name="description" required placeholder="Detailed description of the issue..."></textarea>
        </div>

        <div class="form-group">
            <label for="reporter">Your Name</label>
            <input type="text" id="reporter" name="reporter" placeholder="Your name (optional)">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Submit Ticket</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
