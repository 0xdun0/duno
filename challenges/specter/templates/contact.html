<!DOCTYPE html>
<html>
<head>
    <title>[Quebec] Contact Us - EverSec</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        h1 { color: #667eea; }
        .contact-info { background: #f8f9fa; padding: 20px; margin: 20px 0; border-radius: 5px; }
        .contact-form { margin: 20px 0; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #5568d3; }
    </style>
</head>
<body>
    <h1>Contact EverSec</h1>

    <div class="contact-info">
        <h3>Get in Touch</h3>
        <p><strong>Email:</strong> info@eversec.com</p>
        <p><strong>Phone:</strong> +1 (555) 123-4567</p>
        <p><strong>Address:</strong> 123 Security Boulevard, Cyber City, CC 12345</p>
        <p><strong>Business Hours:</strong> Monday - Friday, 9:00 AM - 5:00 PM EST</p>
    </div>

    <div class="contact-form">
        <h3>Send Us a Message</h3>
        <form action="/contact" method="post">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <p><a href="/">← Back to Home</a></p>
</body>
</html>
