<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Tango] AI Calculator - Powered by ChatGPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .operation-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .operation-btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #333;
        }

        .operation-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .operation-btn.active {
            background: #667eea;
            color: white;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .calculate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-text {
            font-size: 18px;
            color: #333;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
        }

        .status {
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rate-limit-warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }


    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="header">
            <h1>🤖 EverSec Calculator</h1>
            <p>Powered by ChatGPT</p>
        </div>

        <div class="rate-limit-warning">
            ⚠️ Rate limited: 6 requests per minute, 150 per hour
        </div>

        <div class="input-group">
            <label for="num1">First Number:</label>
            <input type="number" id="num1" placeholder="Enter first number" step="any">
        </div>

        <div class="input-group">
            <label for="num2">Second Number:</label>
            <input type="number" id="num2" placeholder="Enter second number" step="any">
        </div>

        <div class="operation-buttons">
            <button class="operation-btn" data-operation="+">+</button>
            <button class="operation-btn" data-operation="-">−</button>
            <button class="operation-btn" data-operation="*">×</button>
            <button class="operation-btn" data-operation="/">÷</button>
        </div>

        <button class="calculate-btn" id="calculateBtn">Calculate with AI</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI is thinking...</p>
        </div>

        <div class="result" id="result">
            <div class="result-text">Enter numbers and select operation</div>
        </div>
        


        <div class="status" id="status">
            Loading status...
        </div>
    </div>

    <script>
        let selectedOperation = '+';

        // Operation button selection
        document.querySelectorAll('.operation-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.operation-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedOperation = this.dataset.operation;
            });
        });

        // Set default active operation
        document.querySelector('.operation-btn[data-operation="+"]').classList.add('active');

        // Calculate button
        document.getElementById('calculateBtn').addEventListener('click', async function() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;

            if (!num1 || !num2) {
                showError('Please enter both numbers');
                return;
            }

            if (selectedOperation === '/' && parseFloat(num2) === 0) {
                showError('Cannot divide by zero');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').innerHTML = '<div class="result-text">Calculating...</div>';
            document.getElementById('calculateBtn').disabled = true;

            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        num1: parseFloat(num1),
                        num2: parseFloat(num2),
                        operation: selectedOperation
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(data);
                    updateStatus();
                } else {
                    showError(data.error || 'Calculation failed');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('calculateBtn').disabled = false;
            }
        });

        function showResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="result-text">
                    <strong>${data.operation} = ${data.clean_result}</strong><br>
                    <small>Requests remaining this hour: ${data.requests_remaining_hour}</small><br>
                    <small>Requests remaining this minute: ${data.requests_remaining_minute}</small>
                </div>
            `;
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result-text error">${message}</div>`;
        }

        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                document.getElementById('status').innerHTML = `
                    Requests this hour: ${data.requests_this_hour}/${data.hourly_limit}<br>
                    Requests this minute: ${data.requests_this_minute}/${data.minute_limit}
                `;
            } catch (error) {
                console.error('Failed to update status:', error);
            }
        }

        // Initial status update
        updateStatus();

        // Update status every 30 seconds
        setInterval(updateStatus, 30000);
    </script>
</body>
</html>
