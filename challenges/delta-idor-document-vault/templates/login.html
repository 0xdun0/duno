<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Delta] EverSec Document Vault - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">EverSec</div>
            <h1>Document Vault</h1>
            <p class="subtitle">Secure Document Management System</p>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>

        <div class="footer">
            <p><strong>EverSec Security Solutions</strong></p>
            <p>Your documents, securely managed</p>
        </div>
    </div>
    <!-- Demo instance - credentials: employee / password123 -->
</body>
</html>
