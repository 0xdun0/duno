<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Papa] EverSec GraphQL API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #61dafb;
        }

        .header-info {
            font-size: 12px;
            color: #858585;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }

        .panel-header {
            background: #2d2d30;
            padding: 10px 15px;
            border-bottom: 1px solid #3e3e42;
            font-size: 12px;
            text-transform: uppercase;
            color: #858585;
        }

        .editor {
            flex: 1;
            padding: 15px;
            background: #1e1e1e;
            overflow: auto;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        .actions {
            padding: 15px;
            background: #2d2d30;
            border-top: 1px solid #3e3e42;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #61dafb;
            color: #1e1e1e;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #4fa8c5;
        }

        button.secondary {
            background: #3e3e42;
            color: #d4d4d4;
        }

        button.secondary:hover {
            background: #505050;
        }

        .results-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .results {
            flex: 1;
            padding: 15px;
            overflow: auto;
            background: #1e1e1e;
        }

        pre {
            margin: 0;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .json-key {
            color: #9cdcfe;
        }

        .json-string {
            color: #ce9178;
        }

        .json-number {
            color: #b5cea8;
        }

        .json-boolean {
            color: #569cd6;
        }

        .json-null {
            color: #569cd6;
        }

        .examples {
            padding: 15px;
            background: #252526;
            border-top: 1px solid #3e3e42;
        }

        .examples h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #858585;
        }

        .example-btn {
            padding: 8px 12px;
            margin: 5px 5px 5px 0;
            background: #3e3e42;
            color: #d4d4d4;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }

        .example-btn:hover {
            background: #505050;
        }

    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚡ EverSec GraphQL API</div>
        <div class="header-info">v2.0 | GraphQL Playground</div>
    </div>

    <div class="container">
        <div class="editor-panel">
            <div class="panel-header">Query Editor</div>
            <div class="editor">
                <textarea id="queryEditor" placeholder="Enter your GraphQL query here...">query {
  users {
    id
    username
    email
    role
  }
}</textarea>
            </div>
            <div class="examples">
                <h3>Example Queries:</h3>
                <button class="example-btn" onclick="loadExample('basic')">Basic Query</button>
                <button class="example-btn" onclick="loadExample('single')">Single User</button>
                <button class="example-btn" onclick="loadExample('search')">Search</button>
            </div>
            <div class="actions">
                <button onclick="executeQuery()">Execute Query (Ctrl+Enter)</button>
                <button class="secondary" onclick="clearEditor()">Clear</button>
            </div>
        </div>

        <div class="results-panel">
            <div class="panel-header">Results</div>
            <div class="results">
                <pre id="results">Results will appear here...</pre>
            </div>
        </div>
    </div>

    <script>
        const examples = {
            basic: `query {
  users {
    id
    username
    email
    role
  }
}`,
            single: `query {
  user(id: 1) {
    id
    username
    email
    bio
  }
}`,
            search: `query {
  search(query: "admin") {
    ... on User {
      id
      username
      email
    }
    ... on Post {
      id
      title
      content
    }
  }
}`
        };

        function loadExample(type) {
            document.getElementById('queryEditor').value = examples[type];
        }

        async function executeQuery() {
            const query = document.getElementById('queryEditor').value;
            const resultsEl = document.getElementById('results');

            try {
                resultsEl.textContent = 'Executing query...';

                const response = await fetch('/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });

                const result = await response.json();

                // Pretty print JSON
                resultsEl.innerHTML = syntaxHighlight(JSON.stringify(result, null, 2));

            } catch (error) {
                resultsEl.textContent = `Error: ${error.message}`;
            }
        }

        function clearEditor() {
            document.getElementById('queryEditor').value = '';
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        // Keyboard shortcut: Ctrl/Cmd + Enter to execute
        document.getElementById('queryEditor').addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                executeQuery();
            }
        });

        // Load basic example on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadExample('basic');
        });
    </script>
</body>
</html>
