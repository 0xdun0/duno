<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Mike] EverSec URL Health Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }

        .result h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .result-details {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-details pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .info-box {
            background: #e7f3ff;
            border: 2px solid #b3d9ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #004085;
        }

        .info-box h4 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-box ul {
            margin-left: 20px;
            line-height: 1.6;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔍</div>
            <h1>EverSec URL Health Checker</h1>
            <p class="subtitle">Monitor website availability and response times</p>
        </div>

        <form id="checkForm">
            <div class="input-group">
                <label for="url">Enter URL to check:</label>
                <input
                    type="text"
                    id="url"
                    name="url"
                    placeholder="https://example.com"
                    value="https://example.com"
                    required
                >
            </div>

            <button type="submit" id="submitBtn">
                Check URL Health
            </button>
        </form>

        <div id="result" class="result"></div>

        <div class="info-box">
            <h4>ℹ️ About This Service</h4>
            <p>This service performs health checks on external URLs and returns detailed response information including status codes, headers, and response body preview.</p>
            <p style="margin-top: 10px;"><strong>Supported protocols:</strong> HTTP, HTTPS</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('checkForm');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = document.getElementById('url').value;

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Checking...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (data.success) {
                    showResult(true, data);
                } else {
                    showResult(false, data);
                }

            } catch (error) {
                showResult(false, { error: error.message });
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Check URL Health';
            }
        });

        function showResult(success, data) {
            resultDiv.className = `result ${success ? 'success' : 'error'}`;
            resultDiv.style.display = 'block';

            if (success) {
                resultDiv.innerHTML = `
                    <h3>✅ URL Check Successful</h3>
                    <div class="result-details">
                        <strong>Status Code:</strong> ${data.status_code}<br>
                        <strong>Content Length:</strong> ${data.content_length} bytes<br><br>
                        <strong>Headers:</strong><br>
                        <pre>${JSON.stringify(data.headers, null, 2)}</pre><br>
                        <strong>Response Body (preview):</strong><br>
                        <pre>${escapeHtml(data.body)}</pre>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <h3>❌ URL Check Failed</h3>
                    <div class="result-details">
                        <strong>Error:</strong><br>
                        <pre>${escapeHtml(data.error)}</pre>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
