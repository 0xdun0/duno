<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Charlie] Dashboard - EverSec Employee Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
        }

        .user-info {
            text-align: right;
        }

        .role-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .content {
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .welcome-text {
            color: #666;
            margin-bottom: 30px;
        }

        .nav-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .nav-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .nav-card .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .nav-card h3 {
            margin-bottom: 10px;
        }

        .nav-card p {
            color: #666;
            font-size: 0.9em;
        }

        .logout-btn {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">EverSec</div>
            <div class="user-info">
                <div>Welcome, <strong>{{ username }}</strong></div>
                <div class="role-badge">{{ role|upper }}</div>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="content">
            <h1>Welcome to Your Dashboard</h1>
            <p class="welcome-text">Access your company resources below.</p>

            <div class="nav-links">
                <a href="{{ url_for('profile') }}" class="nav-card">
                    <div class="icon">👤</div>
                    <h3>My Profile</h3>
                    <p>View your profile information</p>
                </a>

                <a href="{{ url_for('profile') }}" class="nav-card">
                    <div class="icon">📋</div>
                    <h3>Company Directory</h3>
                    <p>Browse the employee directory</p>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
