<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Charlie] Profile - EverSec Employee Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .content {
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .profile-card {
            background: #f7fafc;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            font-weight: 600;
            color: #666;
        }

        .profile-value {
            color: #333;
        }

        .role-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">EverSec</div>
            <a href="{{ url_for('dashboard') }}" class="back-btn">← Back to Dashboard</a>
        </div>

        <div class="content">
            <h1>👤 My Profile</h1>

            <div class="profile-card">
                <div class="profile-row">
                    <span class="profile-label">Full Name:</span>
                    <span class="profile-value">{{ name }}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Username:</span>
                    <span class="profile-value">{{ username }}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Role:</span>
                    <span class="profile-value"><span class="role-badge">{{ role|upper }}</span></span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Access Level:</span>
                    <span class="profile-value">{{ 'Full Access' if role in ['manager', 'admin'] else 'Standard Access' }}</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
